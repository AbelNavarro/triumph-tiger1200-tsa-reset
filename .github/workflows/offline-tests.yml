name: Offline tests and preview package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q tsa_adaption_reset.py tsa_analysis.py tsa_reset_evidence.py tsa_session.py tsa_security_access.py tests tools
      - run: python tests/run_all.py
      - run: python tools/build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: tsa-repair-preview
          path: dist/
